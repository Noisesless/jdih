server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/jdih.banjarnegarakab.go.id.key;
  ssl_certificate /etc/nginx/ssl-certificates/jdih.banjarnegarakab.go.id.crt;
  server_name jdih.banjarnegarakab.go.id;
  root /home/jdih1bna/htdocs/jdih.banjarnegarakab.go.id/public;

  access_log /home/jdih1bna/logs/nginx/access.log main;
  error_log /home/jdih1bna/logs/nginx/error.log;

  # Redirect HTTP ke HTTPS
  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  # ===============================================================
  # KEAMANAN: Blokir file .env, .git, dan semua dotfiles
  # ===============================================================
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  # Blokir file konfigurasi, database, backup, log, dan markdown internal
  location ~* (\.env|\.git|composer\.(json|lock)|package(-lock)?\.json|\.lock|\.sql|\.bak|\.log|\.sh|\.md|web\.config)$ {
    deny all;
    return 404;
  }

  

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    
    # Cloudflare Real IP Passthrough (agar IP asli pengunjung tercatat akurat)
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header X-Varnish;
    proxy_hide_header Server;
    add_header Server "JDIH-Portal" always;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map|mjs)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
    try_files $uri =404;
  }

  if (-f $request_filename) {
    break;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name jdih.banjarnegarakab.go.id;
  root /home/jdih1bna/htdocs/jdih.banjarnegarakab.go.id/public;

  include /etc/nginx/global_settings;

  # ===============================================================
  # KEAMANAN BACKEND: Blokir dotfiles & file sensitif layer FastCGI
  # ===============================================================
  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  location ~* (\.env|\.git|composer\.(json|lock)|package(-lock)?\.json|\.lock|\.sql|\.bak|\.log|\.sh|\.md|web\.config)$ {
    deny all;
    return 404;
  }

  index index.php index.html;

  # Standar routing resmi Laravel di CloudPanel
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:20002;
    fastcgi_param PHP_VALUE "
error_log=/home/jdih1bna/logs/php/error.log;
memory_limit=512M;
max_execution_time=60;
max_input_time=60;
max_input_vars=10000;
post_max_size=64M;
upload_max_filesize=64M;
date.timezone=UTC;
display_errors=off;";
  }

  if (-f $request_filename) {
    break;
  }
}
